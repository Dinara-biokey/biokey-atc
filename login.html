<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>biokey.ATC — Вход</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="db.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a10; color: #e8e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(124,92,252,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(124,92,252,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .glow { position: fixed; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(124,92,252,0.12) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -60%); pointer-events: none; }
  .card { position: relative; background: #13131e; border: 1px solid #2a2a3e; border-radius: 24px; padding: 48px 44px 40px; width: 420px; box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(124,92,252,0.08); animation: fadeUp 0.5s ease; }
  @keyframes fadeUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .logo-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; justify-content: center; }
  .logo-text { display: flex; flex-direction: column; line-height: 1; }
  .logo-bio { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; color: #ffffff; }
  .logo-atc { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #7c5cfc; text-transform: uppercase; margin-top: 3px; }
  .divider { height: 1px; background: linear-gradient(90deg, transparent, #2a2a3e, transparent); margin-bottom: 28px; }
  .role-tabs { display: flex; background: #0f0f18; border: 1px solid #2a2a38; border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 24px; }
  .rtab { flex: 1; padding: 8px; text-align: center; font-size: 12px; font-weight: 600; border-radius: 7px; cursor: pointer; color: #5a5a7a; transition: all 0.2s; user-select: none; }
  .rtab:hover { color: #a0a0c0; }
  .rtab.active { background: #7c5cfc; color: #fff; box-shadow: 0 2px 10px rgba(124,92,252,0.4); }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 11px; font-weight: 600; color: #6b6b88; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 7px; }
  .field input { width: 100%; background: #0f0f18; border: 1px solid #2a2a3a; border-radius: 10px; padding: 12px 14px; font-size: 14px; color: #e8e8f0; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
  .field input:focus { border-color: #7c5cfc; box-shadow: 0 0 0 3px rgba(124,92,252,0.12); }
  .field input::placeholder { color: #3a3a55; }
  .error-msg { display: none; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #f87171; margin-bottom: 16px; text-align: center; }
  .error-msg.show { display: block; }
  .submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #7c5cfc, #9d7dfe); border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s; box-shadow: 0 4px 20px rgba(124,92,252,0.35); letter-spacing: 0.02em; margin-top: 8px; }
  .submit-btn:hover { opacity: 0.9; }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn.loading { opacity: 0.6; cursor: default; }
  .card-footer { margin-top: 24px; text-align: center; font-size: 11px; color: #3a3a55; }
  .version { position: fixed; bottom: 20px; font-size: 11px; color: #2a2a42; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="card">
  <div class="logo-wrap">
    <div class="logo-text">
      <div class="logo-bio">biokey<span style="color:#7c5cfc">.</span><span style="color:#a78bfa;font-size:22px">ATC</span></div>
      <div class="logo-atc">Операторский центр</div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="role-tabs">
    <div class="rtab active" id="tab-op" onclick="setRole('operator')">👤 Оператор</div>
    <div class="rtab" id="tab-admin" onclick="setRole('admin')">⚙️ Администратор</div>
  </div>
  <div class="error-msg" id="error-msg">Неверный логин или пароль</div>
  <form onsubmit="doLogin(event)">
    <div class="field">
      <label>Логин</label>
      <input id="inp-login" type="text" placeholder="ivanov.ivan" autocomplete="username" required />
    </div>
    <div class="field">
      <label>Пароль</label>
      <input id="inp-pass" type="password" placeholder="••••••••" autocomplete="current-password" required />
    </div>
    <button class="submit-btn" id="submit-btn" type="submit">Войти</button>
  </form>
  <div class="card-footer">Нет доступа? Обратитесь к администратору.</div>
</div>
<div class="version">biokey.ATC v1.0</div>

<script>
let currentRole = 'operator';

function setRole(role) {
  currentRole = role;
  document.getElementById('tab-op').classList.toggle('active', role === 'operator');
  document.getElementById('tab-admin').classList.toggle('active', role === 'admin');
  document.getElementById('inp-login').placeholder = role === 'admin' ? 'admin' : 'ivanov.ivan';
  hideError();
}

function hideError() { document.getElementById('error-msg').classList.remove('show'); }
function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg || 'Неверный логин или пароль';
  el.classList.add('show');
}

async function doLogin(e) {
  e.preventDefault();
  hideError();
  const login = document.getElementById('inp-login').value.trim();
  const pass  = document.getElementById('inp-pass').value;
  const btn   = document.getElementById('submit-btn');
  btn.classList.add('loading');
  btn.textContent = 'Проверка...';
  try {
    if (currentRole === 'admin') {
      // Проверяем admin_config
      const ok = await window.db.checkAdminLogin(login, pass);
      if (ok) {
        sessionStorage.setItem('atc_session', JSON.stringify({ role: 'admin', name: 'Администратор', login }));
        window.location.href = 'admin.html';
        return;
      }
      // Проверяем РОП
      const rop = await window.db.checkOperatorLogin(login, pass);
      if (rop && rop.role === 'rop' && rop.status === 'active') {
        sessionStorage.setItem('atc_session', JSON.stringify({ role: 'rop', name: rop.name, ext: rop.ext, id: rop.id }));
        window.location.href = 'admin.html';
        return;
      }
      showError('Неверный логин или пароль');
    } else {
      // Оператор → softphone
      const op = await window.db.checkOperatorLogin(login, pass);
      if (op) {
        sessionStorage.setItem('atc_session', JSON.stringify({ role: op.role || 'operator', name: op.name, ext: op.ext, id: op.id }));
        // Если вдруг role=admin/rop попал сюда — тоже в admin.html
        const dest = (op.role === 'admin' || op.role === 'rop') ? 'admin.html' : 'softphone.html';
        window.location.href = dest;
        return;
      }
      showError('Неверный логин или пароль');
    }
  } catch (err) {
    console.error('[login]', err);
    showError('Ошибка соединения с базой данных');
  } finally {
    btn.classList.remove('loading');
    btn.textContent = 'Войти';
  }
}

document.getElementById('inp-login').focus();

// Уже залогинен?
const sess = sessionStorage.getItem('atc_session');
if (sess) {
  try {
    const s = JSON.parse(sess);
    window.location.href = (s.role === 'admin' || s.role === 'rop') ? 'admin.html' : 'softphone.html';
  } catch(e) {}
}
</script>
</body>
</html>
