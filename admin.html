<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATC Admin — Записи разговоров</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f0f1a; color: #e0e0f0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
.topbar { background: #1a1a2e; border-bottom: 1px solid #2a2a4a; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
.topbar-title { font-size: 18px; font-weight: 700; color: #a78bfa; }
.btn-logout { background: none; border: 1px solid #444; color: #aaa; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.btn-logout:hover { border-color: #a78bfa; color: #a78bfa; }
.container { padding: 24px; max-width: 1400px; margin: 0 auto; }
.stats-row { display: flex; gap: 16px; margin-bottom: 20px; }
.stat-card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 16px 20px; flex: 1; }
.stat-card-label { font-size: 12px; color: #666; margin-bottom: 6px; }
.stat-card-value { font-size: 24px; font-weight: 700; color: #a78bfa; }
.filters { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 16px 20px; display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px; }
.filter-group { display: flex; flex-direction: column; gap: 6px; }
.filter-group label { font-size: 12px; color: #888; }
.filter-input, .filter-select { background: #0f0f1a; border: 1px solid #2a2a4a; border-radius: 8px; color: #e0e0f0; padding: 8px 12px; font-size: 14px; }
.filter-input { width: 200px; }
.filter-input:focus { outline: none; border-color: #7c5cfc; }
.btn-reset { background: none; border: 1px solid #444; color: #aaa; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.btn-reset:hover { border-color: #7c5cfc; color: #a78bfa; }
.btn-refresh { background: #7c5cfc22; border: 1px solid #7c5cfc55; color: #a78bfa; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.table-wrap { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; overflow: hidden; }
.table-header { padding: 14px 20px; border-bottom: 1px solid #2a2a4a; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #888; }
table { width: 100%; border-collapse: collapse; }
thead th { background: #151528; padding: 12px 16px; text-align: left; font-size: 12px; font-weight: 600; color: #888; border-bottom: 1px solid #2a2a4a; white-space: nowrap; }
tbody tr { border-bottom: 1px solid #1f1f35; transition: background 0.15s; }
tbody tr:hover { background: #1f1f35; }
tbody td { padding: 12px 16px; font-size: 14px; vertical-align: middle; }
tbody tr:last-child { border-bottom: none; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.badge-in  { background: #0d4a2a; color: #4ade80; }
.badge-out { background: #1a1a4a; color: #a78bfa; }
.empty  { text-align: center; padding: 60px; color: #555; font-size: 15px; }
.loading { text-align: center; padding: 40px; color: #666; }
.error  { text-align: center; padding: 40px; color: #f87171; line-height: 1.8; }
.phone-link { font-family: monospace; font-size: 15px; color: #e0e0f0; cursor: pointer; }
.phone-link:hover { color: #a78bfa; text-decoration: underline; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-title">📞 biokey.ATC — Записи разговоров</div>
  <div style="display:flex;align-items:center;gap:16px">
    <span style="font-size:13px;color:#888" id="topbar-name"></span>
    <button class="btn-logout" onclick="logout()">Выйти</button>
  </div>
</div>
<div class="container">
  <div class="stats-row">
    <div class="stat-card"><div class="stat-card-label">Всего записей</div><div class="stat-card-value" id="stat-total">—</div></div>
    <div class="stat-card"><div class="stat-card-label">Входящих</div><div class="stat-card-value" id="stat-in">—</div></div>
    <div class="stat-card"><div class="stat-card-label">Исходящих</div><div class="stat-card-value" id="stat-out">—</div></div>
    <div class="stat-card"><div class="stat-card-label">Сегодня</div><div class="stat-card-value" id="stat-today">—</div></div>
  </div>
  <div class="filters">
    <div class="filter-group">
      <label>Номер телефона</label>
      <input type="text" class="filter-input" id="f-phone" placeholder="77XXXXXXXXX" oninput="applyFilters()">
    </div>
    <div class="filter-group">
      <label>Направление</label>
      <select class="filter-select" id="f-dir" onchange="applyFilters()">
        <option value="">Все</option>
        <option value="входящий">Входящие</option>
        <option value="исходящий">Исходящие</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Оператор</label>
      <input type="text" class="filter-input" id="f-ext" placeholder="1001" style="width:120px" oninput="applyFilters()">
    </div>
    <div class="filter-group">
      <label>Дата от</label>
      <input type="date" class="filter-input filter-select" id="f-date-from" onchange="applyFilters()" style="width:150px">
    </div>
    <div class="filter-group">
      <label>Дата до</label>
      <input type="date" class="filter-input filter-select" id="f-date-to" onchange="applyFilters()" style="width:150px">
    </div>
    <button class="btn-reset" onclick="resetFilters()">Сбросить</button>
    <button class="btn-refresh" onclick="loadRecordings()">↻ Обновить</button>
  </div>
  <div class="table-wrap">
    <div class="table-header">
      <span>Записи разговоров</span>
      <span id="table-count" style="font-size:13px">...</span>
    </div>
    <div id="table-body"><div class="loading">Загрузка...</div></div>
  </div>
</div>
<script>
const API_BASE = 'https://185.102.75.229:8089';
let allRecordings = [];

function checkAuth() {
  const sess = sessionStorage.getItem('atc_session');
  if (!sess) { window.location.href = 'login.html'; return; }
  try {
    const s = JSON.parse(sess);
    if (s.role !== 'admin' && s.role !== 'rop') { window.location.href = 'softphone.html'; return; }
    document.getElementById('topbar-name').textContent = s.name || s.ext || '';
  } catch(e) { window.location.href = 'login.html'; }
}

async function loadRecordings() {
  try {
    const r = await fetch(API_BASE + '/recordings-api/');
    allRecordings = await r.json();
    updateStats(allRecordings);
    applyFilters();
  } catch(e) {
    document.getElementById('table-body').innerHTML =
      '<div class="error">⚠️ Ошибка загрузки записей.<br>Сначала примите сертификат:<br><br>' +
      '<a href="' + API_BASE + '" target="_blank" style="color:#a78bfa;font-size:16px">Принять сертификат →</a><br><br>' +
      'После принятия нажмите <b style="color:#a78bfa">↻ Обновить</b></div>';
  }
}

function updateStats(data) {
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('stat-total').textContent = data.length;
  document.getElementById('stat-in').textContent  = data.filter(r => r.direction === 'входящий').length;
  document.getElementById('stat-out').textContent = data.filter(r => r.direction === 'исходящий').length;
  document.getElementById('stat-today').textContent = data.filter(r => r.date === today).length;
}

function applyFilters() {
  const phone    = document.getElementById('f-phone').value.trim();
  const dir      = document.getElementById('f-dir').value;
  const ext      = document.getElementById('f-ext').value.trim();
  const dateFrom = document.getElementById('f-date-from').value;
  const dateTo   = document.getElementById('f-date-to').value;
  const filtered = allRecordings.filter(r => {
    if (phone    && !r.callerid.includes(phone)) return false;
    if (dir      && r.direction !== dir)         return false;
    if (ext      && r.exten !== ext)             return false;
    if (dateFrom && r.date < dateFrom)           return false;
    if (dateTo   && r.date > dateTo)             return false;
    return true;
  });
  document.getElementById('table-count').textContent = filtered.length + ' записей';
  renderTable(filtered);
}

function renderTable(data) {
  const el = document.getElementById('table-body');
  if (!data.length) { el.innerHTML = '<div class="empty">Записей не найдено</div>'; return; }
  el.innerHTML = '<table><thead><tr><th>Дата</th><th>Время</th><th>Направление</th><th>Номер телефона</th><th>Оператор</th><th>Запись</th></tr></thead><tbody>' +
    data.map(r => '<tr>' +
      '<td>' + r.date + '</td>' +
      '<td>' + r.time + '</td>' +
      '<td><span class="badge ' + (r.direction === 'входящий' ? 'badge-in' : 'badge-out') + '">' + r.direction + '</span></td>' +
      '<td><span class="phone-link" onclick="filterByPhone(\'' + r.callerid + '\')">' + formatPhone(r.callerid) + '</span></td>' +
      '<td style="color:#a78bfa;font-weight:600">' + r.exten + '</td>' +
      '<td><audio controls preload="none" src="' + API_BASE + '/recordings/' + r.filename + '" style="height:32px;width:250px"></audio></td>' +
      '</tr>').join('') +
    '</tbody></table>';
}

function formatPhone(num) {
  if (num && num.length === 11 && num.startsWith('7'))
    return '+' + num[0] + ' (' + num.slice(1,4) + ') ' + num.slice(4,7) + '-' + num.slice(7,9) + '-' + num.slice(9);
  return num;
}

function filterByPhone(phone) {
  document.getElementById('f-phone').value = phone;
  applyFilters();
}

function resetFilters() {
  ['f-phone','f-ext','f-date-from','f-date-to'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-dir').value = '';
  applyFilters();
}

function logout() {
  sessionStorage.removeItem('atc_session');
  window.location.href = 'login.html';
}

checkAuth();
loadRecordings();
setInterval(loadRecordings, 60000);
</script>
</body>
</html>
